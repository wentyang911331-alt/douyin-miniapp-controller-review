<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UI Icon Preview</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #172033;
      --muted: #6b7280;
      --border: #d7dce5;
      --soft: #edf1f6;
      --primary: #2563eb;
      --primary-soft: #e8f0ff;
      --gold: #b7791f;
      --gold-soft: #fff4d6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    main {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 20px 14px 36px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 20px;
      line-height: 1.35;
    }

    .lead {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .section {
      margin-top: 14px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
    }

    .section-title {
      margin: 0 0 10px;
      font-size: 14px;
      font-weight: 800;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));
      gap: 10px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 48px;
      padding: 8px;
      border: 1px solid var(--soft);
      border-radius: 8px;
      background: #fbfcfe;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      flex: 0 0 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--soft);
      color: var(--muted);
    }

    .icon-btn.active {
      border-color: color-mix(in srgb, var(--primary), white 25%);
      background: var(--primary-soft);
      color: var(--primary);
    }

    .icon-btn.gold {
      border-color: #e3c77b;
      background: var(--gold-soft);
      color: var(--gold);
    }

    .icon-btn svg,
    .inline-icon svg {
      width: 20px;
      height: 20px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .meta {
      min-width: 0;
    }

    .name {
      font-size: 12px;
      font-weight: 800;
      line-height: 1.3;
    }

    .desc {
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .best-badge,
    .rank-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 22px;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
      line-height: 1;
    }

    .best-badge {
      border: 1px solid #e3c77b;
      background: var(--gold-soft);
      color: var(--gold);
    }

    .rank-badge {
      border: 1px solid var(--border);
      background: var(--soft);
      color: var(--text);
    }

    .inline-icon {
      display: inline-flex;
      width: 14px;
      height: 14px;
      align-items: center;
      justify-content: center;
    }

    .inline-icon svg {
      width: 14px;
      height: 14px;
      stroke-width: 2;
    }
  </style>
</head>
<body>
  <main>
    <h1>圆角图标体系预览</h1>
    <p class="lead">仅用于 UI 验收，不改动原始 HTML。所有可点击图标采用圆角容器，图形使用圆角线性 SVG。</p>

    <section class="section">
      <h2 class="section-title">工具与模块图标</h2>
      <div class="grid">
        <div class="item">
          <span class="icon-btn active" aria-label="主题">
            <svg viewBox="0 0 20 20"><path d="M11.8 2.8a6.8 6.8 0 1 0 5.4 10.9 7.2 7.2 0 0 1-8.9-8.9 6.8 6.8 0 0 1 3.5-2z"/></svg>
          </span>
          <div class="meta"><div class="name">主题切换</div><div class="desc">半月图形，状态用激活色表达</div></div>
        </div>
        <div class="item">
          <span class="icon-btn gold" aria-label="最佳徽章">
            <svg viewBox="0 0 20 20"><path d="m10 2.8 2.1 4.2 4.6.7-3.3 3.2.8 4.5L10 13.3l-4.1 2.1.8-4.5-3.3-3.2 4.6-.7L10 2.8z"/></svg>
          </span>
          <div class="meta"><div class="name">最佳徽章</div><div class="desc">星标用于最佳项开关与标签</div></div>
        </div>
        <div class="item">
          <span class="icon-btn active" aria-label="排名角标">
            <svg viewBox="0 0 20 20"><rect x="3.5" y="4" width="13" height="12" rx="3"/><path d="M7 8h6M7 12h4"/></svg>
          </span>
          <div class="meta"><div class="name">排名角标</div><div class="desc">圆角编号标记，不用井号字符当图标</div></div>
        </div>
        <div class="item">
          <span class="icon-btn" aria-label="显示列">
            <svg viewBox="0 0 20 20"><rect x="3" y="4" width="3.5" height="12" rx="1.3"/><rect x="8.25" y="4" width="3.5" height="12" rx="1.3"/><rect x="13.5" y="4" width="3.5" height="12" rx="1.3"/></svg>
          </span>
          <div class="meta"><div class="name">列显示</div><div class="desc">三列圆角竖条，对应显示列面板</div></div>
        </div>
        <div class="item">
          <span class="icon-btn" aria-label="说明">
            <svg viewBox="0 0 20 20"><rect x="3.5" y="3.5" width="13" height="13" rx="4"/><path d="M10 9.2v4.2"/><path d="M10 6.7h.01"/></svg>
          </span>
          <div class="meta"><div class="name">模块信息</div><div class="desc">标题旁唤起测试说明浮窗</div></div>
        </div>
        <div class="item">
          <span class="icon-btn" aria-label="关闭">
            <svg viewBox="0 0 20 20"><rect x="3.5" y="3.5" width="13" height="13" rx="4"/><path d="m7.5 7.5 5 5M12.5 7.5l-5 5"/></svg>
          </span>
          <div class="meta"><div class="name">关闭弹窗</div><div class="desc">圆角 X，保持 32px 热区</div></div>
        </div>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">排序状态</h2>
      <div class="grid">
        <div class="item">
          <span class="icon-btn" aria-label="默认排序">
            <svg viewBox="0 0 20 20"><path d="M7 4v12M7 4 4.5 6.5M7 4l2.5 2.5M13 16V4M13 16l-2.5-2.5M13 16l2.5-2.5"/></svg>
          </span>
          <div class="meta"><div class="name">排序默认</div><div class="desc">未选中列使用弱化上下箭头</div></div>
        </div>
        <div class="item">
          <span class="icon-btn active" aria-label="升序">
            <svg viewBox="0 0 20 20"><path d="M10 16V4M10 4 5.5 8.5M10 4l4.5 4.5"/></svg>
          </span>
          <div class="meta"><div class="name">排序升序</div><div class="desc">当前排序列使用激活色</div></div>
        </div>
        <div class="item">
          <span class="icon-btn active" aria-label="降序">
            <svg viewBox="0 0 20 20"><path d="M10 4v12M10 16l-4.5-4.5M10 16l4.5-4.5"/></svg>
          </span>
          <div class="meta"><div class="name">排序降序</div><div class="desc">与升序同宽，避免表头跳动</div></div>
        </div>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">表格内徽章示例</h2>
      <div class="badge-row">
        <span class="best-badge"><span class="inline-icon"><svg viewBox="0 0 20 20"><path d="m10 3 2 4 4.4.6-3.2 3.1.8 4.3-4-2.1-4 2.1.8-4.3-3.2-3.1L8 7l2-4z"/></svg></span>最佳</span>
        <span class="rank-badge">#1</span>
        <span class="rank-badge">#2</span>
        <span class="rank-badge">#3</span>
      </div>
    </section>
  </main>
</body>
</html>
